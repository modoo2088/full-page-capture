<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>Full Page Capture</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="app">

    <header class="app-header">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#fff" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round">
          <path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/>
          <circle cx="12" cy="13" r="3.4"/>
        </svg>
      </div>
      <div class="titles">
        <h1>Full Page Capture</h1>
        <p class="sub">스크린샷 도구 · 로컬 처리 · 업로드 없음</p>
      </div>
    </header>

    <div id="notice" class="notice hidden" role="alert"></div>

    <section class="card">
      <button id="btnFull" class="btn btn-primary">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <rect x="6" y="3" width="12" height="18" rx="2"/>
          <path d="M12 7.5v6m0 0l-2.3-2.3M12 13.5l2.3-2.3"/>
        </svg>
        <span>전체 페이지 캡처</span>
      </button>
      <button id="btnVisible" class="btn btn-secondary">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="13" rx="2"/>
          <path d="M8 21h8M12 17v4"/>
        </svg>
        <span>현재 화면 캡처</span>
      </button>

      <div id="progressWrap" class="progress-wrap hidden">
        <div class="progress-label" id="progressLabel">전체 페이지 캡처 중...</div>
        <div class="progress-bar" id="progressBar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="progress-meta" id="progressMeta">준비 중...</div>
      </div>
    </section>

    <section class="card hidden" id="resultCard">
      <div class="result-head">
        <span class="status-dot ok" id="statusDot"></span>
        <span class="status" id="statusText">캡처 결과 준비 완료</span>
      </div>

      <div class="thumb-wrap">
        <img id="thumb" alt="캡처 미리보기 (클릭하면 크게 볼 수 있습니다)" title="클릭하면 크게 볼 수 있습니다">
      </div>

      <div class="meta-row">
        <span id="dimText">- × - px</span>
        <span id="sizeText">-</span>
      </div>

      <div id="chips" class="chips hidden"></div>

      <button id="btnPng" class="btn btn-action" disabled>
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="5" width="18" height="14" rx="2"/>
          <circle cx="8.5" cy="10" r="1.5"/>
          <path d="M21 15.5l-5-5L5 19"/>
        </svg>
        <span>PNG 저장</span>
      </button>
      <button id="btnPdf" class="btn btn-action" disabled>
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8l-5-5z"/>
          <path d="M14 3v5h5"/>
        </svg>
        <span>PDF 저장</span>
      </button>
      <button id="btnClip" class="btn btn-action" disabled>
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <rect x="5" y="5" width="14" height="16" rx="2"/>
          <path d="M9 5a3 3 0 0 1 6 0"/>
        </svg>
        <span>클립보드에 복사</span>
      </button>
      <button id="btnAgain" class="btn btn-ghost">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12a9 9 0 1 1-2.64-6.36"/>
          <path d="M21 3v6h-6"/>
        </svg>
        <span>다시 캡처</span>
      </button>
    </section>

    <section class="card">
      <label class="field-label" for="filenameInput">파일명</label>
      <input id="filenameInput" type="text" spellcheck="false" autocomplete="off" placeholder="사이트명_페이지제목_날짜_시간">
    </section>

    <footer class="app-footer">
      <div id="recentText" class="recent"></div>
      <div class="privacy">모든 처리는 브라우저 로컬에서만 이루어집니다 (No Upload)</div>
    </footer>

  </main>

  <script src="vendor/jspdf.umd.min.js"></script>
  <script src="utils.js"></script>
  <script src="pdf.js"></script>
  <script src="popup.js"></script>
</body>
</html>
